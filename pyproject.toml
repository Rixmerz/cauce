[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauce"
version = "0.2.0"
description = "One core for Claude Code: route each task to the right model, effort and capabilities, escalate on evidence, and remember what failed across repositories"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The core is standard library only. A hook runs on every prompt, and a
# dependency that fails to import there is a session that fails to start.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "coverage>=7"]

[project.scripts]
cauce = "cauce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cauce.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.coverage.run]
source = ["cauce"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
